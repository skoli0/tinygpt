[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyGPT"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "mlx>=0.31.1",
    "kernels>=0.11.7",
    "mlflow",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
